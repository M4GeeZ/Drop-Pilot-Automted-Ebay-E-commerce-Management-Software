<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>DropPilot Capture</title></head><body><header><span>DP</span><div><b>DropPilot</b><small>Research capture</small></div></header><p>Review the current page details. Enter the visible price and shipping manually; no background scraping.</p><label>Product URL<input id="url" type="url"></label><label>Product title<input id="title"></label><div class="row"><label>Price ($)<input id="price" type="number" min="0" step=".01"></label><label>Shipping ($)<input id="shipping" type="number" min="0" step=".01"></label></div><label>Availability<select id="stock"><option>Unknown</option><option>In stock</option><option>Out of stock</option></select></label><label>DropPilot URL<input id="port" type="url" value="http://127.0.0.1:8765"></label><button id="send">Send to DropPilot →</button><button class="secondary" id="copy">Copy capture JSON</button><p id="msg" role="status"></p><script src="popup.js"></script></body></html>
